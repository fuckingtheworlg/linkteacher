# UniClass nginx 配置（放在 /etc/nginx/sites-available/uniclass）
#
# 角色分工：
#   /          → admin/dist 静态资源（管理后台）
#   /api       → 反代到本机 NestJS（pm2 监听 3000）
#   /uploads   → 静态文件托管（用户上传图片，与 server/uploads 同源）
#
# 上线前必改：
#   1. server_name 替换为真实域名（已备案）
#   2. 80 端口配置仅做引导用；HTTPS 由 certbot --nginx 自动注入

upstream uniclass_api {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name your-domain.com;

  # 推荐：让 certbot 接管以下注释的 HTTPS 块
  # 如临时仅用 IP / HTTP 调试，请保持当前 80 端口配置即可

  client_max_body_size 10m;       # 允许 5MB 图片上传 + buffer

  # 管理后台静态资源（dist 由 admin 构建产物拷贝过来）
  root /opt/uniclass/app/admin/dist;
  index index.html;

  # gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1024;

  # ============ 后端 API 反代 ============
  location /api/ {
    proxy_pass http://uniclass_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
  }

  # ============ 上传文件直发（不过 NestJS） ============
  # 性能更优；与 server/src/main.ts 中 express.static('/uploads') 互斥使用
  location /uploads/ {
    alias /opt/uniclass/app/server/uploads/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # ============ 管理后台 SPA fallback ============
  # 当前 admin 用 hash 路由，理论上无需 fallback；保留以防切换到 history 模式
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 安全相关
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
